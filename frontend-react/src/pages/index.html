<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar medicamento | Dose Certa</title>
  <link rel="stylesheet" href="../styles/style.css">
</head>
<body>
  <main class="app-shell">
    <header class="page-heading">
      <p class="eyebrow">Dose Certa</p>
      <h1>Cadastrar medicamento</h1>
      <p>Preencha os dados para criar seus lembretes.</p>
    </header>

    <form id="medication-form" class="medication-form">
      <label for="medicamento">Nome ou marca</label>
      <input
        id="medicamento"
        type="text"
        placeholder="Ex.: Dipirona 500mg"
        required
      >

      <label for="intervalo">Intervalo entre as doses</label>
      <div class="select-wrap">
        <select id="intervalo">
          <option value="4">4 horas</option>
          <option value="6">6 horas</option>
          <option value="8" selected>8 horas</option>
          <option value="12">12 horas</option>
          <option value="24">24 horas</option>
        </select>
      </div>

      <label for="dias">Quantidade de dias</label>
      <div class="select-wrap">
        <select id="dias">
          <option value="1">1 dia</option>
          <option value="3">3 dias</option>
          <option value="5">5 dias</option>
          <option value="7" selected>7 dias</option>
          <option value="10">10 dias</option>
          <option value="14">14 dias</option>
          <option value="21">21 dias</option>
          <option value="30">30 dias</option>
        </select>
      </div>

      <label for="horario">Horário da primeira dose</label>
      <input id="horario" type="time" value="08:00" required>

      <fieldset>
        <legend>Tipo de lembrete</legend>
        <div class="reminder-type">
          <button type="button" class="choice active" aria-pressed="true">
            ◉ Alarme
          </button>
          <button type="button" class="choice" aria-pressed="false">
            ○ Notificação
          </button>
        </div>
      </fieldset>

      <section class="next-doses" aria-live="polite">
        <span>Próximas doses</span>
        <strong id="dose-preview">08:00 · 16:00 · 00:00 · 08:00</strong>
      </section>

      <button class="primary-button" type="submit">
        Cadastrar medicamento
      </button>
    </form>
  </main>

  <nav class="bottom-nav" aria-label="Navegação principal">
    <a class="active" href="index.html"><b>⌂</b>Início</a>
    <a href="medicamento.html"><b>▣</b>Medicamentos</a>
    <a href="lembrete.html"><b>◉</b>Lembretes</a>
    <a href="confing.html"><b>⚙</b>Configurações</a>
  </nav>

  <script src="../../public/app.js"></script>
</body>
</html>
